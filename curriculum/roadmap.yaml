schema_version: 0.1.0
course_id: infratutor_high_speed_interconnect_onboarding
title: 高速互联新人培训路线
target_learner: 刚毕业、具备普通计算机基础但缺少 HPC/高速互联经验的计算机专业新人
authoring_policy:
  knowledge_source: human_curated
  llm_role: adaptive_explanation_and_rubric_based_assessment
  v0_1_hard_edge_type: prerequisite
stages:
- id: stage_1_shell_slurm_c
  order: 1
  title: Shell / Slurm / C 基础
  goal: 能够进入集群、理解作业资源、阅读和轻量修改测试程序，并建立进程与内存基础。
  exit_capabilities:
  - 能用 Shell 完成常见文件、进程、环境和日志操作
  - 能区分并使用 salloc、srun、sbatch
  - 能读懂 C 中的内存、指针和基础编译链接流程
- id: stage_2_hip_dcu
  order: 2
  title: HIP / DCU
  goal: 理解 CPU 与 DCU 的异构协作、Host/Device 内存和设备拓扑。
  exit_capabilities:
  - 能解释 Host code、Kernel 和 DCU 线程层次
  - 能运行和读懂简单 HIP 程序
  - 能描述 PCIe、NUMA、DCU 和 HCA 的基本拓扑关系
- id: stage_3_ib_rdma_theory
  order: 3
  title: InfiniBand / RDMA 理论
  goal: 理解 HCA、DMA、内存注册和 RDMA 数据路径的核心心智模型。
  exit_capabilities:
  - 能解释为什么需要 RDMA
  - 能解释经典 Memory Registration 的作用与边界
  - 能区分 one-sided、two-sided 和 completion 等基本概念
- id: stage_4_rdma_verbs
  order: 4
  title: RDMA Verbs
  goal: 把 RDMA 理论映射到 verbs 对象、状态机和基础程序。
  exit_capabilities:
  - 能解释 Context、PD、MR、CQ、QP 的关系
  - 能理解 QP 状态转换和 WR/WQE/SGE
  - 能运行和修改基础 ping-pong 程序
- id: stage_5_mpi
  order: 5
  title: MPI
  goal: 理解分布式进程通信模型、P2P、集合通信和 Slurm 启动映射。
  exit_capabilities:
  - 能编写和运行基础 MPI 程序
  - 能区分 blocking、nonblocking 和常见 collective
  - 能初步分析消息大小、同步和映射对性能的影响
- id: stage_6_ucx
  order: 6
  title: UCX
  goal: 理解 UCX 分层、对象、传输选择、协议和上层集成。
  exit_capabilities:
  - 能解释 UCP、UCT、UCS 的职责
  - 能查看和理解 UCX 的 transport/device 选择
  - 能定位常见配置与 progress 问题
- id: stage_7_rccl
  order: 7
  title: RCCL
  goal: 理解多 DCU 集合通信算法、通道、传输路径和 rccl-tests。
  exit_capabilities:
  - 能解释 Ring、Tree、Channel 和拓扑发现
  - 能运行 rccl-tests 并解释 algbw/busbw
  - 能使用日志和基础指标观察多节点通信问题
- id: stage_8_network_data_analysis
  order: 8
  title: 网络数据分析
  goal: 将 benchmark、计数器、日志与拓扑整理成可复现的性能证据。
  exit_capabilities:
  - 能设计可靠的测量流程
  - 能清洗、可视化和关联多层数据
  - 能形成有结论、有证据的性能报告
- id: stage_9_network_design_optimization
  order: 9
  title: 网络设计与综合性能优化
  goal: 跨硬件拓扑、网络、运行时和集合通信算法完成设计与系统优化。
  exit_capabilities:
  - 能从工作负载通信模式推导网络需求
  - 能使用对照实验定位跨层瓶颈
  - 能完成综合设计、优化和评审
